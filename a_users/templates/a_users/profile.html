{% extends 'layouts/box.html' %}
{% block content %}

<img src="{{ profile.avatar }}" class="w-16 h-16 rounded-full object-cover mb-4 mx-auto"  />
<div class="text-center">
    <!-- 2. Changed .name to .displayname (based on your earlier database error) -->
    <h1 class="text-xl font-bold">
        {% if profile.displayname %}
            {{ profile.displayname }}
        {% else %}
            {{ profile.user.username }}
        {% endif %}
    </h1>
    
    <!-- Removed the duplicate name div, or change it to show username -->
    <div class="text-gray-400 mb-2 -mt-3">@{{ profile.user.username }}</div>
    
    {% if profile.info %}
    <div class="mt-8">{{ profile.info|linebreaksbr }}</div>
    {% endif %}  
</div>

{% endblock %}
